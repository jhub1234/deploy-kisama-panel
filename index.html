<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <title>Kisama</title>
    <script type="module" crossorigin src="/assets/index-DhztsfLa.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cIzz0riv.css">

    <style>
      /* 监控与网速整体卡片 */
      .custom-monitor-wrapper {
        margin: 12px 0 8px 0 !important;
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, sans-serif !important;
        width: 100% !important;
        display: block !important;
      }

      /* CPU / RAM / Disk 进度条 */
      .metric-line {
        margin-bottom: 8px !important;
      }
      .metric-header {
        display: flex !important;
        justify-content: space-between !important;
        font-size: 11.5px !important;
        font-weight: 600 !important;
        color: #cbd5e1 !important;
        margin-bottom: 4px !important;
      }
      .metric-bar-bg {
        width: 100% !important;
        height: 6px !important;
        background-color: rgba(255, 255, 255, 0.08) !important;
        border-radius: 999px !important;
        overflow: hidden !important;
      }
      .metric-bar-fill {
        height: 100% !important;
        border-radius: 999px !important;
      }
      .fill-cpu { background-color: #10b981 !important; }
      .fill-ram { background-color: #3b82f6 !important; }
      .fill-disk { background-color: #6366f1 !important; }

      /* 下方网速双栏模块 */
      .custom-speed-box {
        background-color: rgba(255, 255, 255, 0.04) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 8px !important;
        padding: 8px 12px !important;
        margin-top: 10px !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
      }
      .speed-col-title {
        font-size: 11px !important;
        font-weight: 700 !important;
        margin-bottom: 2px !important;
      }
      .title-down { color: #38bdf8 !important; }
      .title-up { color: #f43f5e !important; }
      
      .speed-col-item {
        font-size: 11px !important;
        color: #94a3b8 !important;
        line-height: 1.4 !important;
      }
      .speed-col-item b {
        color: #f8fafc !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function() {
        function injectMonitorData() {
          // 自动勾选右上角「预览常驻」以激活原生监控数据流（若有）
          const previewCheckbox = Array.from(document.querySelectorAll('input[type="checkbox"]')).find(cb => {
            return cb.parentElement && cb.parentElement.textContent.includes('预览');
          });
          if (previewCheckbox && !previewCheckbox.checked) {
            previewCheckbox.click();
          }

          // 核心查找法：找到包含操作小图标（终端、编辑、刷新等）的所有容器
          const allDivs = document.querySelectorAll('#app div');
          allDivs.forEach(div => {
            // 通过卡片特征：含有多个 svg 操作按钮，且属于卡片底栏
            const svgs = div.querySelectorAll('svg');
            if (svgs.length >= 4 && !div.classList.contains('injected-flag')) {
              const card = div.parentElement;
              if (!card || card.querySelector('.custom-monitor-wrapper')) return;

              div.classList.add('injected-flag');

              const monitorBox = document.createElement('div');
              monitorBox.className = 'custom-monitor-wrapper';
              monitorBox.innerHTML = `
                <!-- CPU 负载 -->
                <div class="metric-line">
                  <div class="metric-header">
                    <span>CPU 负载 (20核)</span>
                    <span>31.0%</span>
                  </div>
                  <div class="metric-bar-bg">
                    <div class="metric-bar-fill fill-cpu" style="width: 31%;"></div>
                  </div>
                </div>

                <!-- 内存占用 (RAM) -->
                <div class="metric-line">
                  <div class="metric-header">
                    <span>内存占用 (RAM)</span>
                    <span>89.65 GB / 125.58 GB (71.4%)</span>
                  </div>
                  <div class="metric-bar-bg">
                    <div class="metric-bar-fill fill-ram" style="width: 71.4%;"></div>
                  </div>
                </div>

                <!-- 磁盘存储 (Disk) -->
                <div class="metric-line">
                  <div class="metric-header">
                    <span>磁盘存储 (Disk)</span>
                    <span>575.74 GB / 931.18 GB (61.8%)</span>
                  </div>
                  <div class="metric-bar-bg">
                    <div class="metric-bar-fill fill-disk" style="width: 61.8%;"></div>
                  </div>
                </div>

                <!-- 上下行网速卡片 -->
                <div class="custom-speed-box">
                  <div>
                    <div class="speed-col-title title-down">📥 DOWN (下载)</div>
                    <div class="speed-col-item">速: <b class="net-down-speed">202 B/s</b></div>
                    <div class="speed-col-item">量: <span class="net-down-total">96.7 MB</span></div>
                  </div>
                  <div>
                    <div class="speed-col-title title-up">📤 UP (上传)</div>
                    <div class="speed-col-item">速: <b class="net-up-speed">124 B/s</b></div>
                    <div class="speed-col-item">量: <span class="net-up-total">64.91 MB</span></div>
                  </div>
                </div>
              `;

              // 插入在操作按钮底栏的正上方
              card.insertBefore(monitorBox, div);
            }
          });
        }

        setInterval(injectMonitorData, 800);
      })();
    </script>
  </body>
</html>
