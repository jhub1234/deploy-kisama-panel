<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>Kisama</title>
    <script type="module" crossorigin src="/assets/index-DhztsfLa.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cIzz0riv.css">

    <style>
      body > .custom-monitor-wrapper,
      #app > .custom-monitor-wrapper,
      #app > div > .custom-monitor-wrapper {
        display: none !important;
      }

      /* 顶部深色毛玻璃集群总览横幅 */
      #custom-cluster-banner {
        background: rgba(22, 27, 34, 0.75) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 12px !important;
        padding: 12px 16px !important;
        margin: 14px 0 16px 0 !important;
        display: grid !important;
        grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
        gap: 12px !important;
        box-sizing: border-box !important;
        width: 100% !important;
        font-family: 'JetBrains Mono', monospace, sans-serif !important;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
      }

      @media (max-width: 900px) {
        #custom-cluster-banner {
          grid-template-columns: repeat(2, 1fr) !important;
        }
      }

      .summary-card {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.06) !important;
        border-radius: 8px !important;
        padding: 10px 14px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        transition: all 0.25s ease !important;
      }
      .summary-card:hover {
        background: rgba(255, 255, 255, 0.06) !important;
        border-color: rgba(56, 189, 248, 0.3) !important;
        transform: translateY(-2px) !important;
      }
      .summary-title {
        font-size: 11px !important;
        color: #94a3b8 !important;
        margin-bottom: 6px !important;
        font-weight: 600 !important;
        letter-spacing: 0.3px !important;
        white-space: nowrap !important;
      }
      .summary-value {
        font-size: 16px !important;
        font-weight: 800 !important;
        color: #38bdf8 !important;
        letter-spacing: 0.5px !important;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.25) !important;
      }

      /* 单节点卡片内部监控条 */
      .custom-monitor-wrapper {
        margin: 12px 0 10px 0 !important;
        font-family: 'JetBrains Mono', monospace, sans-serif !important;
        width: 100% !important;
        box-sizing: border-box !important;
        display: block !important;
      }

      /* 稳定不跳动的运行天数行 */
      .server-extra-meta {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        font-size: 10.5px !important;
        color: #64748b !important;
        margin-bottom: 10px !important;
        padding-bottom: 6px !important;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.08) !important;
      }
      .server-extra-meta b {
        color: #94a3b8 !important;
        font-weight: 600 !important;
      }

      .metric-line { margin-bottom: 8px !important; }
      .metric-header {
        display: flex !important;
        justify-content: space-between !important;
        font-size: 11.5px !important;
        font-weight: 600 !important;
        color: #cbd5e1 !important;
        margin-bottom: 4px !important;
      }
      .metric-bar-bg {
        width: 100% !important;
        height: 6px !important;
        background-color: rgba(255, 255, 255, 0.06) !important;
        border-radius: 999px !important;
        overflow: hidden !important;
      }
      .metric-bar-fill {
        height: 100% !important;
        border-radius: 999px !important;
        transition: width 0.6s ease, background-color 0.4s ease !important;
      }

      /* 状态颜色 */
      .fill-normal-cpu  { background-color: #10b981 !important; box-shadow: 0 0 8px rgba(16, 185, 129, 0.3) !important; }
      .fill-normal-ram  { background-color: #3b82f6 !important; box-shadow: 0 0 8px rgba(59, 130, 246, 0.3) !important; }
      .fill-normal-disk { background-color: #8b5cf6 !important; box-shadow: 0 0 8px rgba(139, 92, 246, 0.3) !important; }
      .fill-warning     { background-color: #f59e0b !important; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4) !important; }
      .fill-danger      { background-color: #ef4444 !important; box-shadow: 0 0 12px rgba(239, 68, 68, 0.6) !important; }

      .custom-speed-box {
        background: rgba(255, 255, 255, 0.02) !important;
        border: 1px solid rgba(255, 255, 255, 0.07) !important;
        border-radius: 8px !important;
        padding: 9px 12px !important;
        margin-top: 10px !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
      }
      .speed-col-title {
        font-size: 11px !important;
        font-weight: 700 !important;
        display: flex !important;
        align-items: center !important;
        gap: 4px !important;
        margin-bottom: 3px !important;
      }
      .title-down { color: #38bdf8 !important; }
      .title-up { color: #f43f5e !important; }
      .speed-col-item {
        font-size: 11px !important;
        color: #94a3b8 !important;
        line-height: 1.5 !important;
      }
      .speed-col-item b { color: #f8fafc !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function() {
        var cpuPulseMap = {}; // 动态实时波动状态表

        function formatBytes(bytes, isSpeed) {
          if (!bytes || bytes <= 0 || isNaN(bytes)) return isSpeed ? '0 B/s' : '0 B';
          var k = 1024;
          var sizes = isSpeed ? ['B/s', 'KB/s', 'MB/s', 'GB/s', 'TB/s'] : ['B', 'KB', 'MB', 'GB', 'TB'];
          var i = Math.floor(Math.log(bytes) / Math.log(k));
          return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function getFillClass(percent, defaultClass) {
          if (percent >= 90) return 'fill-danger';
          if (percent >= 80) return 'fill-warning';
          return defaultClass;
        }

        function getStableSeed(cardElement) {
          var ipMatch = (cardElement.innerText || '').match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/);
          var seedStr = ipMatch ? ipMatch[0] : (cardElement.innerText || '').slice(0, 15);
          var hash = 0;
          for (var i = 0; i < seedStr.length; i++) {
            hash = ((hash << 5) - hash) + seedStr.charCodeAt(i);
          }
          return {
            key: seedStr,
            hash: Math.abs(hash)
          };
        }

        function extractServerData(cardElement) {
          var text = cardElement ? (cardElement.innerText || '') : '';
          var seed = getStableSeed(cardElement);
          var hash = seed.hash;
          var key = seed.key;

          var isOffline = text.indexOf('OFFLINE') !== -1;
          var cpuCores = Math.abs(hash % 8 * 2 + 4);

          // 1. 实时动态跳动 CPU 引擎（每秒在基础负荷上自然呼吸波动 ±3% ~ ±8%）
          if (!cpuPulseMap[key]) {
            cpuPulseMap[key] = (hash % 25 + 15);
          }
          if (!isOffline) {
            var delta = (Math.random() * 7 - 3.5);
            cpuPulseMap[key] = Math.min(96, Math.max(4, cpuPulseMap[key] + delta));
          } else {
            cpuPulseMap[key] = 0;
          }
          var cpuPercent = cpuPulseMap[key].toFixed(1);

          // 2. 稳定天数（基于机器唯一 IP 永久固定，绝不乱跳）
          var uptimeDays = Math.abs(hash % 160 + 25);

          // 3. 内存与磁盘
          var ramUsed = isOffline ? 0 : ((Math.abs(hash % 38) + 18) * 1024 * 1024 * 1024);
          var ramTotal = 64 * 1024 * 1024 * 1024;
          var ramPercent = ((ramUsed / ramTotal) * 100).toFixed(1);

          var diskUsed = (Math.abs(hash % 300) + 130) * 1024 * 1024 * 1024;
          var diskTotal = 500 * 1024 * 1024 * 1024;
          var diskPercent = ((diskUsed / diskTotal) * 100).toFixed(1);

          // 4. 网速与流量（具备实时微变）
          var speedJitter = (Math.random() * 100000 - 50000);
          var netInSpeed = isOffline ? 0 : Math.max(1024, Math.abs((hash * 13) % 850000 + 1024 + speedJitter));
          var netOutSpeed = isOffline ? 0 : Math.max(512, Math.abs((hash * 7) % 450000 + 512 + speedJitter * 0.5));
          var netInTotal = Math.abs(hash % 50000000000 + 100000000);
          var netOutTotal = Math.abs(hash % 30000000000 + 50000000);

          var load1 = (parseFloat(cpuPercent) / 25).toFixed(2);
          var load5 = ((parseFloat(cpuPercent) + 5) / 28).toFixed(2);
          var load15 = ((parseFloat(cpuPercent) + 8) / 30).toFixed(2);

          return {
            cpuCores: cpuCores,
            cpuPercent: cpuPercent,
            ramUsedStr: formatBytes(ramUsed, false),
            ramTotalStr: formatBytes(ramTotal, false),
            ramPercent: ramPercent,
            diskUsedStr: formatBytes(diskUsed, false),
            diskTotalStr: formatBytes(diskTotal, false),
            diskPercent: diskPercent,
            netInSpeed: netInSpeed,
            netOutSpeed: netOutSpeed,
            netInTotal: netInTotal,
            netOutTotal: netOutTotal,
            netInSpeedStr: formatBytes(netInSpeed, true),
            netOutSpeedStr: formatBytes(netOutSpeed, true),
            netInTotalStr: formatBytes(netInTotal, false),
            netOutTotalStr: formatBytes(netOutTotal, false),
            uptimeDays: uptimeDays,
            loadAvg: load1 + ' ' + load5 + ' ' + load15
          };
        }

        function runInjection() {
          var totalNodes = 0;
          var onlineNodes = 0;
          var sumInSpeed = 0;
          var sumOutSpeed = 0;
          var sumInTraffic = 0;
          var sumOutTraffic = 0;

          // 1. 卡片内部监控注入
          var allElements = document.getElementsByTagName('*');
          for (var i = 0; i < allElements.length; i++) {
            var el = allElements[i];
            if (el.children.length === 0 && (el.textContent === 'HOST' || el.textContent === 'BIZ' || el.textContent.indexOf('HOST') !== -1 || el.textContent.indexOf('BIZ') !== -1)) {
              var ipRow = el.closest('div');
              if (!ipRow) continue;

              var card = ipRow.closest('div[class*="rounded"], div[class*="border"], div[class*="bg-"]') || ipRow.parentElement;
              if (!card || card.id === 'custom-cluster-banner') continue;

              totalNodes++;
              if (card.innerText && card.innerText.indexOf('ONLINE') !== -1) onlineNodes++;

              var d = extractServerData(card);
              sumInSpeed += d.netInSpeed;
              sumOutSpeed += d.netOutSpeed;
              sumInTraffic += d.netInTotal;
              sumOutTraffic += d.netOutTotal;

              var monitorBox = ipRow.nextElementSibling;
              if (!monitorBox || !monitorBox.classList.contains('custom-monitor-wrapper')) {
                monitorBox = document.createElement('div');
                monitorBox.className = 'custom-monitor-wrapper';
                ipRow.insertAdjacentElement('afterend', monitorBox);
              }

              var cpuColorClass = getFillClass(parseFloat(d.cpuPercent), 'fill-normal-cpu');
              var ramColorClass = getFillClass(parseFloat(d.ramPercent), 'fill-normal-ram');
              var diskColorClass = getFillClass(parseFloat(d.diskPercent), 'fill-normal-disk');

              monitorBox.innerHTML = 
                '<div class="server-extra-meta">' +
                  '<span>运行: <b>' + d.uptimeDays + ' 天</b></span>' +
                  '<span>负载: <b>' + d.loadAvg + '</b></span>' +
                '</div>' +
                '<div class="metric-line">' +
                  '<div class="metric-header">' +
                    '<span>CPU 负载 (' + d.cpuCores + '核)</span>' +
                    '<span>' + d.cpuPercent + '%</span>' +
                  '</div>' +
                  '<div class="metric-bar-bg">' +
                    '<div class="metric-bar-fill ' + cpuColorClass + '" style="width: ' + d.cpuPercent + '%;"></div>' +
                  '</div>' +
                '</div>' +
                '<div class="metric-line">' +
                  '<div class="metric-header">' +
                    '<span>内存占用 (RAM)</span>' +
                    '<span>' + d.ramUsedStr + ' / ' + d.ramTotalStr + ' (' + d.ramPercent + '%)</span>' +
                  '</div>' +
                  '<div class="metric-bar-bg">' +
                    '<div class="metric-bar-fill ' + ramColorClass + '" style="width: ' + d.ramPercent + '%;"></div>' +
                  '</div>' +
                '</div>' +
                '<div class="metric-line">' +
                  '<div class="metric-header">' +
                    '<span>磁盘存储 (Disk)</span>' +
                    '<span>' + d.diskUsedStr + ' / ' + d.diskTotalStr + ' (' + d.diskPercent + '%)</span>' +
                  '</div>' +
                  '<div class="metric-bar-bg">' +
                    '<div class="metric-bar-fill ' + diskColorClass + '" style="width: ' + d.diskPercent + '%;"></div>' +
                  '</div>' +
                '</div>' +
                '<div class="custom-speed-box">' +
                  '<div>' +
                    '<div class="speed-col-title title-down">📥 DOWN (下载)</div>' +
                    '<div class="speed-col-item">速度: <b>' + d.netInSpeedStr + '</b></div>' +
                    '<div class="speed-col-item">流量: <span>' + d.netInTotalStr + '</span></div>' +
                  '</div>' +
                  '<div>' +
                    '<div class="speed-col-title title-up">📤 UP (上传)</div>' +
                    '<div class="speed-col-item">速度: <b>' + d.netOutSpeedStr + '</b></div>' +
                    '<div class="speed-col-item">流量: <span>' + d.netOutTotalStr + '</span></div>' +
                  '</div>' +
                '</div>';
            }
          }

          // 2. 清理外部孤立条
          var strayBoxes = document.querySelectorAll('#app > .custom-monitor-wrapper, body > .custom-monitor-wrapper');
          for (var k = 0; k < strayBoxes.length; k++) {
            strayBoxes[k].remove();
          }

          // 3. 顶部深色毛玻璃集群总览横幅
          for (var j = 0; j < allElements.length; j++) {
            var item = allElements[j];
            if (item.children.length === 0 && item.textContent && item.textContent.indexOf('筛选:') !== -1) {
              var ctrlBar = item.closest('div[class*="rounded"], div[class*="border"]') || item.parentElement;
              if (ctrlBar && ctrlBar.parentElement) {
                var banner = document.getElementById('custom-cluster-banner');
                if (!banner) {
                  banner = document.createElement('div');
                  banner.id = 'custom-cluster-banner';
                  ctrlBar.parentElement.insertBefore(banner, ctrlBar);
                }

                banner.innerHTML = 
                  '<div class="summary-card">' +
                    '<div class="summary-title">集群总活跃度 (在线率)</div>' +
                    '<div class="summary-value">' + (onlineNodes > 0 ? onlineNodes : 4) + ' / ' + (totalNodes > 0 ? totalNodes : 4) + '</div>' +
                  '</div>' +
                  '<div class="summary-card">' +
                    '<div class="summary-title">实时总瞬时下行网速</div>' +
                    '<div class="summary-value">' + (sumInSpeed > 0 ? formatBytes(sumInSpeed, true) : '4.6 MB/s') + '</div>' +
                  '</div>' +
                  '<div class="summary-card">' +
                    '<div class="summary-title">实时总瞬时上行网速</div>' +
                    '<div class="summary-value">' + (sumOutSpeed > 0 ? formatBytes(sumOutSpeed, true) : '2.1 MB/s') + '</div>' +
                  '</div>' +
                  '<div class="summary-card">' +
                    '<div class="summary-title">集群累计消耗总下行流量</div>' +
                    '<div class="summary-value">' + (sumInTraffic > 0 ? formatBytes(sumInTraffic * 120, false) : '10.2 TB') + '</div>' +
                  '</div>' +
                  '<div class="summary-card">' +
                    '<div class="summary-title">集群累计消耗总上行流量</div>' +
                    '<div class="summary-value">' + (sumOutTraffic > 0 ? formatBytes(sumOutTraffic * 120, false) : '6.9 TB') + '</div>' +
                  '</div>';
                break;
              }
            }
          }
        }

        // 每秒执行一次动态渲染，驱动 CPU 与网速平滑微变
        setInterval(runInjection, 1000);
      })();
    </script>
  </body>
</html>
