<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <title>Kisama</title>
    <script type="module" crossorigin src="/assets/index-DhztsfLa.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cIzz0riv.css">

    <style>
      /* 完整监控扩展容器 */
      .custom-monitor-wrapper {
        margin: 12px 0 10px 0 !important;
        font-family: 'JetBrains Mono', monospace, sans-serif !important;
        width: 100% !important;
        box-sizing: border-box !important;
        display: block !important;
      }

      /* 进度条样式 */
      .metric-line {
        margin-bottom: 8px !important;
      }
      .metric-header {
        display: flex !important;
        justify-content: space-between !important;
        font-size: 11.5px !important;
        font-weight: 600 !important;
        color: #cbd5e1 !important;
        margin-bottom: 4px !important;
      }
      .metric-bar-bg {
        width: 100% !important;
        height: 6px !important;
        background-color: rgba(255, 255, 255, 0.08) !important;
        border-radius: 999px !important;
        overflow: hidden !important;
      }
      .metric-bar-fill {
        height: 100% !important;
        border-radius: 999px !important;
      }
      .fill-cpu { background-color: #10b981 !important; }
      .fill-ram { background-color: #3b82f6 !important; }
      .fill-disk { background-color: #6366f1 !important; }

      /* 下方网速双栏卡片 */
      .custom-speed-box {
        background-color: rgba(255, 255, 255, 0.04) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 8px !important;
        padding: 8px 12px !important;
        margin-top: 10px !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
      }
      .speed-col-title {
        font-size: 11px !important;
        font-weight: 700 !important;
        display: flex !important;
        align-items: center !important;
        gap: 4px !important;
        margin-bottom: 2px !important;
      }
      .title-down { color: #38bdf8 !important; }
      .title-up { color: #f43f5e !important; }
      
      .speed-col-item {
        font-size: 11px !important;
        color: #94a3b8 !important;
        line-height: 1.4 !important;
      }
      .speed-col-item b {
        color: #f8fafc !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function() {
        function buildMonitorHtml() {
          return `
            <!-- CPU 负载 -->
            <div class="metric-line">
              <div class="metric-header">
                <span>CPU 负载 (20核)</span>
                <span>31.0%</span>
              </div>
              <div class="metric-bar-bg">
                <div class="metric-bar-fill fill-cpu" style="width: 31%;"></div>
              </div>
            </div>

            <!-- 内存占用 (RAM) -->
            <div class="metric-line">
              <div class="metric-header">
                <span>内存占用 (RAM)</span>
                <span>89.65 GB / 125.58 GB (71.4%)</span>
              </div>
              <div class="metric-bar-bg">
                <div class="metric-bar-fill fill-ram" style="width: 71.4%;"></div>
              </div>
            </div>

            <!-- 磁盘存储 (Disk) -->
            <div class="metric-line">
              <div class="metric-header">
                <span>磁盘存储 (Disk)</span>
                <span>575.74 GB / 931.18 GB (61.8%)</span>
              </div>
              <div class="metric-bar-bg">
                <div class="metric-bar-fill fill-disk" style="width: 61.8%;"></div>
              </div>
            </div>

            <!-- 上下行网速卡片 -->
            <div class="custom-speed-box">
              <div>
                <div class="speed-col-title title-down">📥 DOWN (下载)</div>
                <div class="speed-col-item">速: <b class="net-down-speed">202 B/s</b></div>
                <div class="speed-col-item">量: <span class="net-down-total">96.7 MB</span></div>
              </div>
              <div>
                <div class="speed-col-title title-up">📤 UP (上传)</div>
                <div class="speed-col-item">速: <b class="net-up-speed">124 B/s</b></div>
                <div class="speed-col-item">量: <span class="net-up-total">64.91 MB</span></div>
              </div>
            </div>
          `;
        }

        function runInjection() {
          // 直接遍历页面所有元素，找到显示 IP 的这一行（包含 HOST 或 BIZ）
          const allElements = document.querySelectorAll('*');
          allElements.forEach(el => {
            if (el.children.length === 0 && (el.textContent.includes('HOST') || el.textContent.includes('BIZ') || el.textContent.includes('None'))) {
              // 找到 IP 这一整行的容器
              const ipRow = el.closest('div');
              if (!ipRow) return;

              // 检查该 IP 行后面是否已经挂载了监控组件
              if (ipRow.nextElementSibling && ipRow.nextElementSibling.classList.contains('custom-monitor-wrapper')) {
                return;
              }

              // 创建监控组件
              const monitorBox = document.createElement('div');
              monitorBox.className = 'custom-monitor-wrapper';
              monitorBox.innerHTML = buildMonitorHtml();

              // 精准插入在 IP 行的正下方
              ipRow.insertAdjacentElement('afterend', monitorBox);
            }
          });
        }

        // 高频监测以防 Vue 重新渲染抹除 DOM
        setInterval(runInjection, 500);
      })();
    </script>
  </body>
</html>
