<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <title>Kisama</title>
    <script type="module" crossorigin src="/assets/index-DhztsfLa.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cIzz0riv.css">

    <style>
      /* 复刻复古暗色网速卡片 */
      .custom-speed-box {
        background-color: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 8px !important;
        padding: 8px 12px !important;
        margin: 10px 0 !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
        font-family: 'JetBrains Mono', monospace, sans-serif !important;
        box-sizing: border-box !important;
        width: 100% !important;
      }
      .speed-col-title {
        font-size: 11px !important;
        font-weight: 700 !important;
        display: flex !important;
        align-items: center !important;
        gap: 4px !important;
        margin-bottom: 2px !important;
      }
      .title-down { color: #38bdf8 !important; }
      .title-up { color: #f43f5e !important; }
      
      .speed-col-item {
        font-size: 11px !important;
        color: #94a3b8 !important;
        line-height: 1.4 !important;
      }
      .speed-col-item b {
        color: #f8fafc !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function() {
        function injectSpeedCards() {
          // 查找所有包含系统架构（X86_64）或 IP 地址的容器
          const textNodes = Array.from(document.querySelectorAll('*')).filter(el => 
            el.children.length === 0 && (el.textContent.includes('X86_64') || el.textContent.includes('aarch64') || el.textContent.includes('[HOST]') || el.textContent.includes('[BIZ]'))
          );

          textNodes.forEach(node => {
            // 获取该节点所属的内容块容器
            const contentContainer = node.parentElement;
            if (!contentContainer) return;

            // 往上找到卡片的内容父级
            const cardBody = contentContainer.closest('div');
            if (!cardBody) return;

            // 获取顶层卡片或者内容区容器，避免在同一个卡片内重复插入
            const card = cardBody.parentElement;
            if (!card || card.querySelector('.custom-speed-box')) return;

            // 找到包含底部操作按钮（图标行）的容器
            const actionRow = Array.from(card.querySelectorAll('div')).find(div => 
              div.querySelectorAll('svg, button, i').length >= 3
            );

            const speedBox = document.createElement('div');
            speedBox.className = 'custom-speed-box';
            speedBox.innerHTML = `
              <div>
                <div class="speed-col-title title-down">📥 DOWN (下载)</div>
                <div class="speed-col-item">速: <b class="net-down-speed">-- B/s</b></div>
                <div class="speed-col-item">量: <span class="net-down-total">-- MB</span></div>
              </div>
              <div>
                <div class="speed-col-title title-up">📤 UP (上传)</div>
                <div class="speed-col-item">速: <b class="net-up-speed">-- B/s</b></div>
                <div class="speed-col-item">量: <span class="net-up-total">-- MB</span></div>
              </div>
            `;

            // 精准插入到 IP 内容块之后、底部操作图标栏之前
            if (actionRow && actionRow.parentElement === card) {
              card.insertBefore(speedBox, actionRow);
            } else {
              contentContainer.insertAdjacentElement('afterend', speedBox);
            }
          });
        }

        // 持续监听 Vue 挂载与更新
        const observer = new MutationObserver(() => injectSpeedCards());
        const app = document.getElementById('app');
        if (app) {
          observer.observe(app, { childList: true, subtree: true });
        }

        // 周期重试确保异步加载后也能插入
        setInterval(injectSpeedCards, 1000);
      })();
    </script>
  </body>
</html>
